[package]
name = "world-bevy"
version = "0.1.3"
edition = "2024"
description = "World Rust Bevy"
repository = "https://github.com/abpilot-cc/GraphOS"
license = "ISC"

[dependencies]
nanoid = "0.5.0"
bevy_app = "0.18.1"
bevy_ecs = { version = "0.18.1", features = ["debug"] }
bevy_time = "0.18.1"
bytes = { version = "1.10.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
